[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caustic"
version = "0.3.0"
description = "Predict NMR backbone chemical shifts from 3D protein structure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Maxim" },
]
keywords = ["NMR", "chemical shifts", "protein", "structure", "GNN", "SchNet", "AlphaFold"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "gemmi>=0.6",
    "onnxruntime>=1.16",
    "torch>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
train = [
    "torch-geometric>=2.4",
    "pyyaml>=6.0",
]
bmrb = [
    "pynmrstar>=3.3",
]

[project.scripts]
caustic = "caustic.cli:main"

[project.urls]
Homepage = "https://github.com/bluegems661/caustic"
Documentation = "https://github.com/bluegems661/caustic#readme"

[tool.hatch.build.targets.wheel]
packages = ["caustic"]

[tool.hatch.build.targets.wheel.force-include]
"caustic/data/best_v2_carbons.onnx" = "caustic/data/best_v2_carbons.onnx"

[tool.hatch.build.targets.sdist]
include = [
    "caustic/**/*.py",
    "caustic/data/*.onnx",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
