[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# Distribution name, not the import name. `caustic` on PyPI belongs to an unrelated
# gravitational-lensing project, so declaring it would have pointed installers at a
# stranger's package. The import name stays `caustic`, matching the sibling
# `facet-nmr`/`facet` pair.
name = "caustic-nmr"
dynamic = ["version"]
description = "Predict protein backbone NMR chemical shifts from 3D structure (PaiNN GNN, ONNX Runtime)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-WEIGHTS", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [
    { name = "Maximilian Zinke", email = "maximilian.zinke@gmail.com" },
]
keywords = ["NMR", "chemical shifts", "protein", "structure", "GNN", "PaiNN", "AlphaFold", "ONNX"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "gemmi>=0.6",
    "onnxruntime>=1.16",
    "torch>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
train = [
    "torch-geometric>=2.4",
    "pyyaml>=6.0",
]
bmrb = [
    "pynmrstar>=3.3",
]
dev = [
    "pytest>=7",
    "ruff>=0.5,<0.17",
    "build>=1.0",
    "twine>=5",
    "onnx>=1.15",
]

[project.scripts]
caustic = "caustic.cli:main"

[project.urls]
Homepage = "https://github.com/maxzinke/caustic-nmr"
Repository = "https://github.com/maxzinke/caustic-nmr"
Issues = "https://github.com/maxzinke/caustic-nmr/issues"
Changelog = "https://github.com/maxzinke/caustic-nmr/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.22213167"
"Web app" = "https://huggingface.co/spaces/SiXa18/caustic"
"Model weights" = "https://huggingface.co/SiXa18/caustic-weights"

[tool.hatch.version]
path = "caustic/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["caustic"]

[tool.hatch.build.targets.wheel.force-include]
"caustic/data/best_v2_carbons.onnx" = "caustic/data/best_v2_carbons.onnx"
"caustic/data/sa16_calibrator_v2.json" = "caustic/data/sa16_calibrator_v2.json"

[tool.hatch.build.targets.sdist]
include = [
    "caustic/**/*.py",
    "caustic/data/*.onnx",
    "caustic/data/*.json",
    "tests/**",
    "examples/**",
    "docs/*.md",
    "/README.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/LICENSE",
    "/LICENSE-WEIGHTS",
    "/THIRD_PARTY_NOTICES.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501: the graph/feature modules carry long physics comments and data tables;
# wrapping them adds churn without value. Everything else in E/F/W is enforced.
ignore = ["E501"]
